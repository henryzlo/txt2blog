name: Publish

# collect: pull new Telegram messages into content/ and commit them.
# build + deploy: regenerate the site from content/ and publish to Pages.
#
# Telegram only keeps undelivered messages for 24 hours, so collecting runs
# every 4 hours. Publishing runs once a day (the 09:17 UTC run), on every
# push to main, and when started by hand.

on:
  schedule:
    - cron: "17 1,5,13,17,21 * * *" # collect only
    - cron: "17 9 * * *" # collect + publish (4:17am New York in winter)
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Collect new Telegram messages
        run: npm run collect
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ vars.TELEGRAM_OWNER_ID }}

      - name: Commit content
        run: |
          git add content
          if git diff --cached --quiet; then
            echo "Nothing new."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Collect messages from Telegram"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

  build:
    needs: collect
    if: github.event_name != 'schedule' || github.event.schedule == '17 9 * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The branch tip, so this includes what collect just committed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run check

      - name: Build site
        run: npm run build
        env:
          BLOG_TITLE: ${{ vars.BLOG_TITLE }}
          BLOG_TIMEZONE: ${{ vars.BLOG_TIMEZONE || 'America/New_York' }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
